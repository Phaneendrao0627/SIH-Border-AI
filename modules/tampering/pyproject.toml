[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tampering-detection"
version = "1.0.0"
description = "Module 3: Tampering Detection for AI-Based Fake Identity & Document Screening System"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [
    { name = "Digital Image Forensics Engineering Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Security",
]
dependencies = [
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "pillow>=9.5.0",
    "scikit-image>=0.20.0",
    "scipy>=1.10.0",
    "exifread>=3.0.0",
    "pydantic>=2.0.0",
    "imagehash>=4.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.0",
]

[project.scripts]
tampering-detection = "tampering_detection.cli:main"

[tool.setuptools.packages.find]
include = ["tampering_detection*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
